services:
  - type: web
    name: recon-x
    runtime: python
    plan: starter
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: recon-x-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: RECONX_DATA_DIR
        value: /var/data
      - key: RECONX_SEED_DEMO_DATA
        value: "false"
      - key: RECONX_AUTH_ENABLED
        value: "true"
      - key: RECONX_AUTH_USERNAME
        sync: false
      - key: RECONX_AUTH_PASSWORD
        sync: false
      - key: PGSSLMODE
        value: require
