<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RECON-X · Database Inference Attack Protection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F5;--primary:#0A7075;--dark:#0B4F54;--light:#E6F2F3;--muted:#5d7b7e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:'Montserrat',system-ui,sans-serif;color:var(--dark)}
.field{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.sweep{position:absolute;left:50%;top:50%;width:130vmax;height:130vmax;margin:-65vmax 0 0 -65vmax;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 78%,rgba(10,112,117,.10) 100%);animation:spin 14s linear infinite;
  -webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px solid var(--primary);opacity:0;transform:translate(-50%,-50%);
  animation:ping 9s cubic-bezier(.2,.5,.3,1) infinite}
.ring:nth-child(3){animation-delay:3s}
.ring:nth-child(4){animation-delay:6s}
@keyframes ping{0%{width:8vmin;height:8vmin;opacity:.45}100%{width:150vmax;height:150vmax;opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.stage{position:fixed;inset:0;display:grid;place-items:center;perspective:900px;transition:opacity 1s ease,filter 1s ease,transform 1s ease;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.stage.out{opacity:0;filter:blur(8px);transform:scale(1.04)}
.group{display:flex;flex-direction:column;align-items:center;gap:1.4rem}
.title{display:flex;transform-style:preserve-3d;font-weight:600;font-size:clamp(2.2rem,9.5vw,5.5rem);letter-spacing:.26em;margin-right:-.26em}
.title span{display:inline-block;opacity:0;will-change:transform,opacity}
.title .x{color:var(--primary)}
.rule{width:min(46vw,320px);height:1px;background:linear-gradient(90deg,transparent,var(--primary),transparent);transform:scaleX(0);transition:transform 1.4s cubic-bezier(.16,1,.3,1)}
.rule.on{transform:scaleX(1)}
.tag{font-weight:500;font-size:clamp(.75rem,2.4vw,1rem);letter-spacing:.14em;color:var(--muted);opacity:0;transform:translateY(8px);
  transition:opacity 1.2s ease,transform 1.2s ease;text-align:center;padding:0 1rem}
.tag.on{opacity:1;transform:none}
button{position:fixed;right:max(1.2rem,env(safe-area-inset-right,0px));bottom:max(1.2rem,env(safe-area-inset-bottom,0px));z-index:5;
  font:500 .8rem 'Montserrat',system-ui,sans-serif;letter-spacing:.08em;color:var(--primary);background:none;border:1px solid rgba(10,112,117,.4);
  border-radius:999px;padding:.5rem 1rem;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .8s,background .2s,color .2s}
button.show{opacity:1;pointer-events:auto}
button:hover{background:var(--primary);color:var(--bg)}
button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sweep,.ring{animation:none}.ring{display:none}}
</style>
</head>
<body>
<div class="field" aria-hidden="true"><div class="sweep"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
<div class="stage" id="stage">
  <div class="group">
    <h1 class="title" id="title" aria-label="RECON-X"></h1>
    <div class="rule" id="rule"></div>
    <p class="tag" id="tag">Database Inference Attack Protection</p>
  </div>
</div>
<button id="replay" type="button">Replay</button>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var stage=$('stage'),title=$('title'),rule=$('rule'),tag=$('tag'),btn=$('replay');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var letters=[];
  'RECON-X'.split('').forEach(function(ch){
    var s=document.createElement('span');s.textContent=ch;s.setAttribute('aria-hidden','true');
    if(ch==='X')s.className='x';
    title.appendChild(s);letters.push(s);
  });
  /* Set this to your dashboard's address; the intro opens it when it finishes. */
  var DASHBOARD_URL = '/dashboard';
  function go(){
    if(!DASHBOARD_URL){btn.classList.add('show');return}
    try{(window.top||window).location.href=DASHBOARD_URL}catch(e){window.location.href=DASHBOARD_URL}
  }
  var timers=[];
  function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function reset(){
    letters.forEach(function(s){s.style.transition='none';s.style.opacity='0';s.style.transform='translateZ(-260px) rotateX(-55deg)'});
    rule.classList.remove('on');tag.classList.remove('on');stage.classList.remove('out');btn.classList.remove('show');
  }
  function play(){
    timers.forEach(clearTimeout);timers=[];reset();
    if(reduce){stage.style.display='none';go();return}
    stage.style.display='grid';
    void title.offsetWidth;
    at(300,function(){
      letters.forEach(function(s,i){
        s.style.transition='transform 1.5s cubic-bezier(.16,1,.3,1) '+(i*.09)+'s,opacity 1s ease '+(i*.09)+'s';
        s.style.opacity='1';s.style.transform='none';
      });
    });
    at(1900,function(){rule.classList.add('on')});
    at(2300,function(){tag.classList.add('on');btn.classList.add('show');});
    at(4600,function(){stage.classList.add('out')});
    at(5500,go);
  }
  btn.addEventListener('click',function(e){e.stopPropagation();play();});
  stage.addEventListener('click',go);
  window.addEventListener('keydown',function(e){if(e.key==='Escape'||e.key==='Enter'||e.key===' '){go();}});
  play();
})();
</script>
</body>
</html>
